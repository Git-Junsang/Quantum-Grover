<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="559" rx="10" fill="none" stroke="#e3e3e3"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">인덱스 한 칸이 메모리의 어디에 사는가 — n = 14 · P = 32 · 연산기 4벌</text>
  <text x="380.0" y="49" text-anchor="middle" font-size="11.5" fill="#666">블록램 개수는 2026-09-07 구현 리포트(route_util_hier.rpt)의 실측</text>
  <rect x="130" y="66" width="500" height="62" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="380.0" y="85.0" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">인덱스 i · 14비트</text>
  <text x="380.0" y="101.2" text-anchor="middle" font-size="12" fill="#333">상위 9비트 = 행 번호 0…511  ·  하위 5비트 = 레인 0…31</text>
  <text x="380.0" y="117.4" text-anchor="middle" font-size="12" fill="#333">행 번호 하위 2비트 = 행 위상 뱅크 0…3  ·  나머지 7비트 = 뱅크 안 주소</text>
  <path d="M380,128 L252,160" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M380,128 L507,160" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M380,128 L380,160" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="20" y="162" width="240" height="150" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="140.0" y="194.45000000000002" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">진폭 · 체크포인트 메모리</text>
  <text x="140.0" y="209.97500000000002" text-anchor="middle" font-size="11.5" fill="#333">행 = 32레인 × 23비트 = 736비트</text>
  <text x="140.0" y="225.50000000000003" text-anchor="middle" font-size="11.5" fill="#333">상태 한 벌 = 512행</text>
  <text x="140.0" y="241.02500000000003" text-anchor="middle" font-size="11.5" fill="#333">= RAMB36 11개 (69비트 폭 × 10 + 46)</text>
  <text x="140.0" y="256.55" text-anchor="middle" font-size="11.5" fill="#333">행 위상 뱅크 4 × 물리 슬롯 4</text>
  <text x="140.0" y="272.07500000000005" text-anchor="middle" font-size="11.5" fill="#333">K3 은 슬롯 3개 사용</text>
  <text x="140.0" y="287.6" text-anchor="middle" font-size="11.5" fill="#333">쓰는 것: INIT · 오라클 · 확산</text>
  <rect x="270" y="162" width="220" height="150" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="380.0" y="209.975" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">data_mem</text>
  <text x="380.0" y="225.5" text-anchor="middle" font-size="11.5" fill="#333">탐색 대상 값 value[i]</text>
  <text x="380.0" y="241.025" text-anchor="middle" font-size="11.5" fill="#333">16비트 signed</text>
  <text x="380.0" y="256.55" text-anchor="middle" font-size="11.5" fill="#333">사이클당 4행을 한꺼번에 읽음</text>
  <text x="380.0" y="272.075" text-anchor="middle" font-size="11.5" fill="#333">호스트가 적재, IP 는 읽기만</text>
  <rect x="500" y="162" width="240" height="150" rx="6" fill="#eafbea" stroke="#3aa83a" stroke-width="1.3"/>
  <text x="620.0" y="217.7375" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">found_mask</text>
  <text x="620.0" y="233.26250000000002" text-anchor="middle" font-size="11.5" fill="#333">이미 찾은 답 표시 found[i]</text>
  <text x="620.0" y="248.78750000000002" text-anchor="middle" font-size="11.5" fill="#333">N × 1비트, 4행 동시</text>
  <text x="620.0" y="264.3125" text-anchor="middle" font-size="11.5" fill="#333">열거 모드에서 답마다 한 비트</text>
  <rect x="20" y="330" width="240" height="44" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="140.0" y="356.55" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">RAMB36 44</text>
  <rect x="270" y="330" width="220" height="44" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="380.0" y="356.55" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">RAMB18 64 (= 32 tile)</text>
  <rect x="500" y="330" width="240" height="44" rx="6" fill="#eafbea" stroke="#3aa83a" stroke-width="1.3"/>
  <text x="620.0" y="356.55" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">RAMB36 2</text>
  <path d="M140.0,312 L140.0,330" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M380.0,312 L380.0,330" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M620.0,312 L620.0,330" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="120" y="392" width="520" height="44" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="380.0" y="410.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">그 밖의 Main IP 메모리</text>
  <text x="380.0" y="425.78749999999997" text-anchor="middle" font-size="11.5" fill="#333">측정 행 가중치 512 × 51비트 = RAMB36 2  ·  체크포인트 정책 메모 = RAMB36 4</text>
  <rect x="120" y="456" width="520" height="72" rx="6" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="380.0" y="480.0" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">Main IP 계 84 tile  +  RVX SoC 32 tile (대부분 시스템 SRAM 128 KB)</text>
  <text x="380.0" y="496.2" text-anchor="middle" font-size="12" fill="#333">= 보드 전체 116 / 135 tile</text>
  <text x="380.0" y="512.4" text-anchor="middle" font-size="12" fill="#333">n 을 15 로 올리면 상태 한 벌이 두 배가 되어 보드를 넘는다 (11.4절)</text>
  <path d="M380,436 L380,456" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
</svg>
