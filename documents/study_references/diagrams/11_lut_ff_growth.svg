<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="620" height="380" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="619" height="379" rx="10" fill="none" stroke="#e3e3e3"/>

  <!-- gridlines (log decades) -->
  <line x1="80" y1="40"  x2="560" y2="40"  stroke="#ededed" stroke-width="1"/>
  <line x1="80" y1="170" x2="560" y2="170" stroke="#ededed" stroke-width="1"/>
  <line x1="80" y1="300" x2="560" y2="300" stroke="#cfcfcf" stroke-width="1"/>
  <text x="72" y="44"  font-size="11" fill="#999" text-anchor="end">10⁶</text>
  <text x="72" y="174" font-size="11" fill="#999" text-anchor="end">10⁵</text>
  <text x="72" y="304" font-size="11" fill="#999" text-anchor="end">10⁴</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="560" y2="300" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80"  y2="34"  stroke="#555" stroke-width="1.5"/>
  <text transform="rotate(-90 34 175)" x="34" y="175" font-size="12.5" fill="#555" text-anchor="middle">FPGA 자원 (로그 스케일)</text>

  <!-- x ticks -->
  <text x="80"  y="320" font-size="12" fill="#555" text-anchor="middle">2</text>
  <text x="200" y="320" font-size="12" fill="#555" text-anchor="middle">3</text>
  <text x="320" y="320" font-size="12" fill="#555" text-anchor="middle">4</text>
  <text x="440" y="320" font-size="12" fill="#555" text-anchor="middle">5</text>
  <text x="560" y="320" font-size="12" fill="#555" text-anchor="middle">6</text>
  <text x="320" y="343" font-size="12.5" fill="#555" text-anchor="middle">큐비트 수 n</text>

  <!-- FF line (storage) : nearly flat -->
  <polyline points="80,274.7 200,273.8 320,271.4 440,267.8 560,261.3" fill="none" stroke="#5b8def" stroke-width="2.4"/>
  <g fill="#5b8def">
    <circle cx="80" cy="274.7" r="3.2"/><circle cx="200" cy="273.8" r="3.2"/><circle cx="320" cy="271.4" r="3.2"/><circle cx="440" cy="267.8" r="3.2"/><circle cx="560" cy="261.3" r="3.2"/>
  </g>

  <!-- LUT line (parallel compute) : explodes -->
  <polyline points="80,296.4 200,289.7 320,275.7 440,180.6 560,107.2" fill="none" stroke="#e8663d" stroke-width="2.4"/>
  <g fill="#e8663d">
    <circle cx="80" cy="296.4" r="3.2"/><circle cx="200" cy="289.7" r="3.2"/><circle cx="320" cy="275.7" r="3.2"/><circle cx="440" cy="180.6" r="3.2"/><circle cx="560" cy="107.2" r="3.2"/>
  </g>

  <!-- value callouts -->
  <text x="556" y="100" font-size="11.5" font-weight="bold" fill="#c14a22" text-anchor="end">LUT 303,993</text>
  <text x="556" y="253" font-size="11.5" font-weight="bold" fill="#3a6fd0" text-anchor="end">FF 19,852</text>
  <text x="326" y="292" font-size="10.5" fill="#999">4큐비트: 거의 같은 출발</text>

  <!-- legend -->
  <rect x="96" y="52" width="196" height="46" rx="6" fill="#ffffff" stroke="#e3e3e3"/>
  <line x1="108" y1="68" x2="132" y2="68" stroke="#5b8def" stroke-width="2.6"/>
  <text x="140" y="72" font-size="12" fill="#3a6fd0">FF — 진폭 저장</text>
  <line x1="108" y1="86" x2="132" y2="86" stroke="#e8663d" stroke-width="2.6"/>
  <text x="140" y="90" font-size="12" fill="#c14a22">LUT — 병렬 연산 유닛</text>

  <text x="310" y="368" text-anchor="middle" font-size="11.5" fill="#666">04 Table 4 (Kintex UltraScale+). 저장은 1.2배로 평평, 병렬 연산은 20배로 치솟는다 — LUT 폭발의 범인은 저장이 아니다.</text>
</svg>
