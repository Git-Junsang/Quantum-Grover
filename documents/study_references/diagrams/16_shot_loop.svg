<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="700" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="919" height="699" rx="10" fill="none" stroke="#e3e3e3"/>
  <text x="460.0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">BBHT 자율 모드 — 바깥 샷 루프와 체크포인트</text>
  <text x="460.0" y="49" text-anchor="middle" font-size="11.5" fill="#666">한 번의 시작 명령으로 답을 찾거나 한도에 닿을 때까지 하드웨어가 돈다</text>
  <rect x="290" y="62" width="260" height="36" rx="6" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="420.0" y="84.2" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">시작 · 두 난수 시드 읽기</text>
  <path d="M420,98 L420,116" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="210" y="118" width="420" height="52" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="420.0" y="140.26250000000002" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">샷 시작 · ROM 에서 m 경계 (28항, 최대 128 = √N)</text>
  <text x="420.0" y="155.78750000000002" text-anchor="middle" font-size="11.5" fill="#333">LFSR 기각 샘플링으로 j ∈ [0, m) 정확히 균등</text>
  <path d="M420,170 L420,188" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="210" y="190" width="420" height="52" rx="6" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="420.0" y="212.26250000000002" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">체크포인트 정책 (K3 · H3)</text>
  <text x="420.0" y="227.78750000000002" text-anchor="middle" font-size="11.5" fill="#333">앞으로 올 요청 3개를 미리 계산해 출발 슬롯과 남길 상태를 정함</text>
  <path d="M420,242 L420,260" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="210" y="262" width="420" height="52" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="420.0" y="284.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">안쪽 그로버 반복 (13장)</text>
  <text x="420.0" y="299.78749999999997" text-anchor="middle" font-size="11.5" fill="#333">슬롯 s ≤ j 에서 j − s 회 · 쓸 슬롯이 없으면 INIT 후 j 회</text>
  <path d="M420,314 L420,332" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="210" y="334" width="420" height="36" rx="6" fill="#fffbe6" stroke="#c9a227" stroke-width="1.3"/>
  <text x="420.0" y="356.025" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">측정 (14장) · 진폭은 읽기만</text>
  <path d="M420,370 L420,390" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <polygon points="420,392.0 570.0,420 420,448.0 270.0,420" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="420" y="424.2" text-anchor="middle" font-size="12" fill="#222">검증 · 후보가 술어를 만족하나?</text>
  <path d="M270,420 L130,420 L130,470" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="140" y="412" text-anchor="start" font-size="11" fill="#555">아니오</text>
  <polygon points="130,472.0 230.0,512 130,552.0 30.0,512" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="130" y="501.55" text-anchor="middle" font-size="11" fill="#222">샷 상한 100 ·</text>
  <text x="130" y="515.85" text-anchor="middle" font-size="11" fill="#222">논리 예산 576</text>
  <text x="130" y="530.15" text-anchor="middle" font-size="11" fill="#222">에 닿았나?</text>
  <path d="M130,552 L130,590" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="138" y="575" text-anchor="start" font-size="11" fill="#555">예</text>
  <rect x="30" y="592" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="130.0" y="613.4250000000001" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">탐색 종료</text>
  <text x="130.0" y="628.2750000000001" text-anchor="middle" font-size="11" fill="#333">shot_limit / budget_limit</text>
  <path d="M30,512 L14,512 L14,144 L208,144" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="22" y="300" text-anchor="start" font-size="11" fill="#555">아니오 ·</text>
  <text x="22" y="316" text-anchor="start" font-size="11" fill="#555">다음 ROM 항</text>
  <path d="M570,420 L720,420 L720,466" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="580" y="412" text-anchor="start" font-size="11" fill="#555">예</text>
  <polygon points="720,468.0 815.0,500 720,532.0 625.0,500" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="720" y="504.2" text-anchor="middle" font-size="12" fill="#222">열거 모드인가?</text>
  <path d="M720,532 L720,590" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="728" y="566" text-anchor="start" font-size="11" fill="#555">아니오</text>
  <rect x="630" y="592" width="180" height="50" rx="6" fill="#eafbea" stroke="#3aa83a" stroke-width="1.3"/>
  <text x="720.0" y="613.2624999999999" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">탐색 종료</text>
  <text x="720.0" y="628.7874999999999" text-anchor="middle" font-size="11.5" fill="#333">RESULT_INDEX</text>
  <path d="M815,500 L870,500 L870,302" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="822" y="492" text-anchor="start" font-size="11" fill="#555">예</text>
  <rect x="690" y="190" width="210" height="110" rx="6" fill="#eafbea" stroke="#3aa83a" stroke-width="1.3"/>
  <text x="795.0" y="219.15" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">열거: 답을 결과 FIFO 에</text>
  <text x="795.0" y="234.0" text-anchor="middle" font-size="11" fill="#333">found 비트 세우기</text>
  <text x="795.0" y="248.85000000000002" text-anchor="middle" font-size="11" fill="#333">슬롯 무효화</text>
  <text x="795.0" y="263.7" text-anchor="middle" font-size="11" fill="#333">ROM 첫 항부터 다시</text>
  <text x="795.0" y="278.55" text-anchor="middle" font-size="11" fill="#333">(j 난수는 이어서)</text>
  <path d="M795,190 L795,144 L632,144" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)" stroke-dasharray="5,4"/>
  <text x="460" y="676" text-anchor="middle" font-size="11.5" fill="#555">열거는 한 번의 BBHT 가 답 없이 한도에 닿는 일이 fail_repeat_limit 번(기본 3) 연속되면 끝난다</text>
</svg>
