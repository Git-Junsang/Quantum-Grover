<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="640" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="639" rx="10" fill="none" stroke="#e3e3e3"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">측정 — 행을 먼저 고르고 그 안에서 칸을 고른다 (M1 · M2)</text>
  <text x="380.0" y="49" text-anchor="middle" font-size="11.5" fill="#666">전부 정수로 자르지 않고 계산 · 비교는 엄격한 &gt; · 진폭 메모리는 읽기만</text>
  <rect x="230" y="64" width="300" height="36" rx="6" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="380.0" y="86.2" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">측정 진입 · 진폭 배열 확정</text>
  <path d="M380,100 L380,118" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="120" y="120" width="520" height="84" rx="6" fill="#fffbe6" stroke="#c9a227" stroke-width="1.3"/>
  <text x="380.0" y="142.7375" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">BUILD · 512행을 한 바퀴 읽는다</text>
  <text x="380.0" y="158.26250000000002" text-anchor="middle" font-size="11.5" fill="#333">행마다 32레인 제곱합 = 행 가중치 (51비트) 기록</text>
  <text x="380.0" y="173.78750000000002" text-anchor="middle" font-size="11.5" fill="#333">32행마다 그룹 누적 16개 기록 · 총합 W (60비트)</text>
  <text x="380.0" y="189.3125" text-anchor="middle" font-size="11.5" fill="#333">M1: 사이클당 2행 → 256 사이클 · 제곱 엔진 2벌 · DSP 128</text>
  <path d="M380,204 L380,224" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="120" y="226" width="520" height="56" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="380.0" y="250.26250000000002" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">난수 · 64비트 xorshift 블록의 하위 k 비트 (k = W − 1 의 비트 길이)</text>
  <text x="380.0" y="265.7875" text-anchor="middle" font-size="11.5" fill="#333">W 이상이면 버리고 다시 뽑는다 (기각 샘플링)</text>
  <path d="M640,254 L700,254 L700,292" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="650" y="294" width="100" height="46" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="700.0" y="313.58750000000003" text-anchor="middle" font-size="10.5" fill="#222" font-weight="bold">W = 0</text>
  <text x="700.0" y="327.76250000000005" text-anchor="middle" font-size="10.5" fill="#333">zero_weight</text>
  <path d="M380,282 L380,302" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="120" y="304" width="520" height="44" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="380.0" y="330.025" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">그룹 고르기 (M2) · 그룹 누적이 r 을 처음 넘는 그룹 · 최대 16 사이클</text>
  <path d="M380,348 L380,366" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="120" y="368" width="520" height="44" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="380.0" y="394.025" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">행 고르기 · 그 그룹 32행 안에서 누적이 r 을 처음 넘는 행 · 최대 32 사이클</text>
  <path d="M380,412 L380,430" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="120" y="432" width="520" height="56" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="380.0" y="456.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">레인 고르기 · 고른 행을 다시 읽어 32레인 제곱</text>
  <text x="380.0" y="471.78749999999997" text-anchor="middle" font-size="11.5" fill="#333">행 안 잔여값(r − 앞 행들까지의 누적)을 처음 넘는 레인</text>
  <path d="M380,488 L380,506" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="120" y="508" width="520" height="56" rx="6" fill="#eafbea" stroke="#3aa83a" stroke-width="1.3"/>
  <text x="380.0" y="532.2624999999999" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">후보 {행, 레인} → 검증</text>
  <text x="380.0" y="547.7874999999999" text-anchor="middle" font-size="11.5" fill="#333">data_mem 두 번째 포트로 다시 읽어 술어 · DATA_COUNT · found 판정</text>
  <text x="380" y="596" text-anchor="middle" font-size="11.5" fill="#555">샷 한 번의 나머지 비용(측정 · 검증 · 정책): 측정 최적화 없음 ≈ 821 → M1 ≈ 567 → M2 ≈ 354 사이클</text>
  <text x="380" y="616" text-anchor="middle" font-size="11" fill="#777">(500 워크로드 캠페인에 직선을 맞춘 값, 11.8절)</text>
</svg>
