  <text x="152" y="360" text-anchor="start" font-size="11.5" fill="#444">넷째 샷 j=4: 1칸 캐시는 직전 상태(j=5)보다 작아 INIT 부터 4회. 세 벌이면 남겨 둔 j=2 에서 2회.</text>
  <text x="152" y="380" text-anchor="start" font-size="11.5" fill="#444">어느 상태를 남기느냐는 정책이 앞으로 올 요청을 보고 정한다(16.5절). 이 그림은 여섯 샷짜리 축소 예시다.</text>
