<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="640" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="639" rx="10" fill="none" stroke="#e3e3e3"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">안쪽 반복 FSM — 목표 반복 j 를 받아 j 번 돌고 빠져나온다</text>
  <text x="380.0" y="49" text-anchor="middle" font-size="11.5" fill="#666">최종 구성 E4: 연산기 4벌이 사이클당 4행(128칸)</text>
  <rect x="230" y="64" width="300" height="40" rx="6" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="380.0" y="88.2" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">바깥 FSM 에서 진입 · 목표 반복 j (16장)</text>
  <path d="M380,104 L380,126" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <polygon points="380,128.0 545.0,160 380,192.0 215.0,160" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="380" y="156.39999999999998" text-anchor="middle" font-size="12" fill="#222">이어 쓸 체크포인트 슬롯이 있나?</text>
  <text x="380" y="171.99999999999997" text-anchor="middle" font-size="12" fill="#222">(판정은 16.5절)</text>
  <path d="M215,160 L150,160 L150,196" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="160" y="152" text-anchor="start" font-size="11" fill="#555">아니오</text>
  <path d="M545,160 L610,160 L610,196" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="560" y="152" text-anchor="start" font-size="11" fill="#555">예</text>
  <rect x="40" y="198" width="220" height="64" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="150.0" y="226.1" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">INIT · 128 사이클</text>
  <text x="150.0" y="242.3" text-anchor="middle" font-size="12" fill="#333">전 칸 ← 32,768 (= 2⁻⁷, 오차 0)</text>
  <rect x="500" y="198" width="220" height="64" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="610.0" y="226.1" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">INIT 생략</text>
  <text x="610.0" y="242.3" text-anchor="middle" font-size="12" fill="#333">슬롯 s 에서 j − s 회만 전진</text>
  <path d="M150,262 L150,300 L300,300" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M610,262 L610,300 L460,300" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="180" y="290" width="400" height="96" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="380.0" y="310.97499999999997" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">1패스 · ORACLE + 누산 (128 사이클 + 파이프라인)</text>
  <text x="380.0" y="326.49999999999994" text-anchor="middle" font-size="11.5" fill="#333">value − thr 의 MSB 로 술어 판정</text>
  <text x="380.0" y="342.025" text-anchor="middle" font-size="11.5" fill="#333">DATA_COUNT 밖 · 이미 찾은 칸은 비타겟</text>
  <text x="380.0" y="357.54999999999995" text-anchor="middle" font-size="11.5" fill="#333">맞으면 2의 보수 negate 후 되쓰기</text>
  <text x="380.0" y="373.075" text-anchor="middle" font-size="11.5" fill="#333">같은 흐름에서 연산기마다 32레인 합 → 누산기 4개</text>
  <path d="M380,386 L380,406" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="180" y="408" width="400" height="56" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="380.0" y="432.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">MEAN · 네 누산기 합(39비트)을 13칸 산술 우시프트</text>
  <text x="380.0" y="447.78749999999997" text-anchor="middle" font-size="11.5" fill="#333">round-half-to-even → 2 × 평균 (25비트)</text>
  <path d="M380,464 L380,484" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="180" y="486" width="400" height="56" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="380.0" y="510.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">2패스 · DIFFUSION (128 사이클 + 파이프라인)</text>
  <text x="380.0" y="525.7875" text-anchor="middle" font-size="11.5" fill="#333">amp ← 2 × 평균 − amp · 되쓰기 직전 대칭 포화 ±4,194,303</text>
  <path d="M380,542 L380,560" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <polygon points="380,562.0 490.0,586 380,610.0 270.0,586" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="380" y="590.2" text-anchor="middle" font-size="12" fill="#222">j 회 다 돌았나?</text>
  <path d="M270,586 L120,586 L120,338 L180,338" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="128" y="580" text-anchor="start" font-size="11" fill="#555">아니오</text>
  <path d="M490,586 L560,586" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="500" y="578" text-anchor="start" font-size="11" fill="#555">예</text>
  <rect x="560" y="562" width="180" height="50" rx="6" fill="#eafbea" stroke="#3aa83a" stroke-width="1.3"/>
  <text x="650.0" y="583.2624999999999" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">측정으로 (14장)</text>
  <text x="650.0" y="598.7874999999999" text-anchor="middle" font-size="11.5" fill="#333">반복 1회 ≈ 268 사이클</text>
</svg>
