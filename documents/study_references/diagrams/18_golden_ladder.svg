<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="620" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="619" rx="10" fill="none" stroke="#e3e3e3"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">검증 사다리 — 층마다 다른 버그를 잡는다</text>
  <text x="380.0" y="49" text-anchor="middle" font-size="11.5" fill="#666">궤적이 같아야 하는 것은 같은 칸끼리 · 1단의 float 궤적은 2단과 다를 수 있다</text>
  <rect x="120" y="64" width="520" height="52" rx="6" fill="#f3eefc" stroke="#8a63d2" stroke-width="1.3"/>
  <text x="380.0" y="86.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">고정한 규약</text>
  <text x="380.0" y="101.78750000000001" text-anchor="middle" font-size="11.5" fill="#333">Q1.22 · round-half-to-even · 대칭 포화 · 두 난수 스트림 · 그룹→행→레인 · 정책 동률 규칙</text>
  <path d="M260,116 L260,140" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="40" y="140" width="440" height="70" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.3"/>
  <text x="260.0" y="171.26250000000002" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">1단 · NumPy float64 · Qiskit Aer</text>
  <text x="260.0" y="186.78750000000002" text-anchor="middle" font-size="11.5" fill="#333">알고리즘이 맞나? 술어 방향 · 확산 부호 · 반복 수 · BBHT 스케줄</text>
  <rect x="500" y="140" width="230" height="70" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="615.0" y="171.42499999999998" text-anchor="middle" font-size="11" fill="#222">합격: 이론값 재현</text>
  <text x="615.0" y="186.27499999999998" text-anchor="middle" font-size="11" fill="#333">NumPy ↔ Qiskit 궤적 500/500</text>
  <path d="M480,175 L498,175" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M260,210 L260,250" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="40" y="250" width="440" height="70" rx="6" fill="#fff1ea" stroke="#e8663d" stroke-width="1.3"/>
  <text x="260.0" y="281.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">2단 · Q1.22 bit-exact 기준모델 (골든)</text>
  <text x="260.0" y="296.78749999999997" text-anchor="middle" font-size="11.5" fill="#333">수 표현이 맞나? 반올림 · 포화 · 누산 폭 · 난수 규약</text>
  <rect x="500" y="250" width="230" height="70" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="615.0" y="281.425" text-anchor="middle" font-size="11" fill="#222">합격: 전 실행 오차 &lt; 10⁻³</text>
  <text x="615.0" y="296.27500000000003" text-anchor="middle" font-size="11" fill="#333">보드와 궤적 · 물리 반복 500/500</text>
  <path d="M480,285 L498,285" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M260,320 L260,360" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="40" y="360" width="440" height="70" rx="6" fill="#fffbe6" stroke="#c9a227" stroke-width="1.3"/>
  <text x="260.0" y="391.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">3단 · RTL (verilator · iverilog)</text>
  <text x="260.0" y="406.78749999999997" text-anchor="middle" font-size="11.5" fill="#333">회로가 맞나? FSM · 주소 · 파이프라인 · CSR</text>
  <rect x="500" y="360" width="230" height="70" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="615.0" y="391.425" text-anchor="middle" font-size="11" fill="#222">합격: requested-j 256케이스 bit-exact</text>
  <text x="615.0" y="406.27500000000003" text-anchor="middle" font-size="11" fill="#333">500 워크로드 궤적 일치</text>
  <path d="M480,395 L498,395" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M260,430 L260,470" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <rect x="40" y="470" width="440" height="70" rx="6" fill="#eafbea" stroke="#3aa83a" stroke-width="1.3"/>
  <text x="260.0" y="501.2625" text-anchor="middle" font-size="11.5" fill="#222" font-weight="bold">보드 · Arty A7-100T</text>
  <text x="260.0" y="516.7875" text-anchor="middle" font-size="11.5" fill="#333">실물에서 도는가? 같은 500 워크로드 × 3구성</text>
  <rect x="500" y="470" width="230" height="70" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="615.0" y="501.425" text-anchor="middle" font-size="11" fill="#222">궤적 500/500, 실경과 7.626배</text>
  <text x="615.0" y="516.275" text-anchor="middle" font-size="11" fill="#333">사이클 값은 RTL 과 다름 (축을 섞지 말 것)</text>
  <path d="M480,505 L498,505" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#ah)"/>
  <text x="380" y="574" text-anchor="middle" font-size="11.5" fill="#555">한 칸을 건너뛰면 반올림 버그와 FSM 버그가 섞여 &#x27;얼마나 어긋나야 버그인가&#x27;를 정할 수 없다</text>
</svg>
